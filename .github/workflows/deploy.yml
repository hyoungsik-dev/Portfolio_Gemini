name: Deploy Portfolio Showcase to GitHub Pages

on:
    push:
        branches:
            - master
            - main
    workflow_dispatch:

# Cancel any in-progress runs when a new push is made
concurrency:
    group: "pages"
    cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            # 1단계: GitHub 가상 서버가 내 저장소의 최신 코드를 내려받습니다.
            - name: Checkout Repository
              uses: actions/checkout@v4

            # 2단계: GitHub Pages 배포를 위한 기본 서비스 환경을 설정합니다.
            - name: Setup GitHub Pages
              uses: actions/configure-pages@v5

            # 3단계: 배포할 폴더(v10)의 파일들을 배포용 결과물(Artifact)로 압축해 업로드합니다.
            - name: Upload Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "./type4/v2"

            # 4단계: 업로드된 아티팩트를 실제 라이브 웹사이트(GitHub Pages)로 최종 게시합니다.
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
